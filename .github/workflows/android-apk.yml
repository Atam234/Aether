name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Opsyonal: para pare-pareho ang signing key (para ma-update ang app nang
      # hindi na ina-uninstall), idagdag sa Settings → Secrets → Actions ang:
      # UMPAT_KEYSTORE_BASE64, UMPAT_KEYSTORE_PASSWORD, UMPAT_KEY_ALIAS, UMPAT_KEY_PASSWORD
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.UMPAT_KEYSTORE_BASE64 }}
          UMPAT_KEYSTORE_PASSWORD: ${{ secrets.UMPAT_KEYSTORE_PASSWORD }}
          UMPAT_KEY_ALIAS: ${{ secrets.UMPAT_KEY_ALIAS }}
          UMPAT_KEY_PASSWORD: ${{ secrets.UMPAT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/umpat.keystore"
            export UMPAT_KEYSTORE_FILE="$RUNNER_TEMP/umpat.keystore"
          fi
          gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk UMPAT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UMPAT-apk
          path: UMPAT.apk

      # Direktang download link: Releases → "UMPAT APK (latest)"
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest UMPAT.apk \
            --target "$GITHUB_SHA" \
            --title "UMPAT APK (latest)" \
            --notes "Pinakabagong APK ng UMPAT Communication (galing sa branch ${GITHUB_REF_NAME}). I-download ang UMPAT.apk at i-install sa Android phone." \
            --prerelease
